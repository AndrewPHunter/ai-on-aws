# The lab's login theme: Keycloak's stock login theme (keycloak.v2) in the Medical Information Desk's look.
# Styles only. It overrides no template, message or kc*Class property, so the sign-in form's markup, field
# names, ids and action stay what the stock theme renders: the gates sign people in by reading that form
# (platform/identity/src/login-form.ts).
parent=keycloak.v2

# The list replaces the parent's, so it names the parent's own stylesheet first and this theme's last, so
# this theme's rules win where both set the same thing.
styles=css/styles.css css/desk.css

# Light whatever the browser prefers: the stock theme's dark variant is left out.
darkMode=false
