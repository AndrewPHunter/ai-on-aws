# Runs the identity gate on the network of a running stack, as one of the stack's containers would reach
# the provider. Run it with platform/identity/gate.sh, which names the network and passes platform/identity/.env.
name: ai-on-aws-identity-gate

services:
  gate:
    build:
      context: ../../..
      # The gate's one dependency, jose, installed from the committed lockfile in the pinned Node image.
      # node:22-bookworm-slim (Node 22.23.5), pinned by digest; the same digest as toolchain/Dockerfile
      dockerfile_inline: |
        FROM node@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
        RUN mkdir /repo && chown node:node /repo
        WORKDIR /repo
        USER node
        COPY --chown=node:node package.json package-lock.json ./
        RUN npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    image: ai-on-aws-identity-gate:local
    volumes:
      - ../src:/repo/platform/identity/src:ro
      - ./:/repo/platform/identity/gate:ro
    environment:
      # Where the gate reaches the provider: its service name on the stack's network.
      IDENTITY_URL: http://identity:8080
      IDENTITY_DESK_CLIENT_SECRET: ${IDENTITY_DESK_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_RILEY_PASSWORD: ${IDENTITY_RILEY_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_DANA_PASSWORD: ${IDENTITY_DANA_PASSWORD:?run platform/identity/setup.sh}
    networks:
      - stack
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    command: ["node", "/repo/platform/identity/gate/gate.ts", "/repo/platform/identity/gate/gate.config.json"]

networks:
  # The default network of the compose project the identity service runs in: <project>_default.
  stack:
    external: true
    name: ${IDENTITY_GATE_NETWORK:?pass the compose project name to platform/identity/gate.sh}
