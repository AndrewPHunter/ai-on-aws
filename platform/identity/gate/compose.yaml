# Runs the identity gate (gate) and the stack gate (stack-gate) on the network of a running stack, as one
# of the stack's containers would. Run them with platform/identity/gate.sh and stack-gate.sh, which name the
# network and pass platform/identity/.env.
name: ai-on-aws-identity-gate

x-gate: &gate
  build:
    context: ../../..
    # The gate's one dependency, jose, installed from the committed lockfile in the pinned Node image.
    # node:22-bookworm-slim (Node 22.23.5), pinned by digest; the same digest as toolchain/Dockerfile
    dockerfile_inline: |
      FROM node@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
      RUN mkdir /repo && chown node:node /repo
      WORKDIR /repo
      USER node
      COPY --chown=node:node package.json package-lock.json ./
      RUN npm ci --omit=dev --ignore-scripts --no-audit --no-fund
  # Named for the checkout it was built from, so two checkouts never run each other's gate. The scripts set the tag.
  image: ai-on-aws-identity-gate:${IDENTITY_GATE_IMAGE_TAG:?run platform/identity/gate.sh or stack-gate.sh, which name the image for this checkout}
  volumes:
    - ../src:/repo/platform/identity/src:ro
    - ./:/repo/platform/identity/gate:ro
  networks:
    - stack
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true

services:
  gate:
    <<: *gate
    environment:
      # Where the gate reaches the provider: its service name on the stack's network.
      IDENTITY_URL: http://identity:8080
      IDENTITY_DESK_CLIENT_SECRET: ${IDENTITY_DESK_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_INTAKE_HANDWRITTEN_CLIENT_SECRET: ${IDENTITY_INTAKE_HANDWRITTEN_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_INTAKE_STRANDS_CLIENT_SECRET: ${IDENTITY_INTAKE_STRANDS_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_EXPERT_CLIENT_SECRET: ${IDENTITY_EXPERT_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_ORCHESTRATOR_CLIENT_SECRET: ${IDENTITY_ORCHESTRATOR_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_EVALUATION_CLIENT_SECRET: ${IDENTITY_EVALUATION_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_KNOWLEDGE_GATE_CLIENT_SECRET: ${IDENTITY_KNOWLEDGE_GATE_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_CONTACT_FORM_CLIENT_SECRET: ${IDENTITY_CONTACT_FORM_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_LAB_EXPLORER_CLIENT_SECRET: ${IDENTITY_LAB_EXPLORER_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_RILEY_PASSWORD: ${IDENTITY_RILEY_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_DANA_PASSWORD: ${IDENTITY_DANA_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_MORGAN_PASSWORD: ${IDENTITY_MORGAN_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_AVERY_PASSWORD: ${IDENTITY_AVERY_PASSWORD:?run platform/identity/setup.sh}
    command: ["node", "/repo/platform/identity/gate/gate.ts", "/repo/platform/identity/gate/gate.config.json"]

  stack-gate:
    <<: *gate
    environment:
      # The four people sign in through the client and, for the tokens the gate presents itself, through the
      # desk client directly; the agents' and machines' secrets get the tokens it exchanges or asks for.
      IDENTITY_DANA_PASSWORD: ${IDENTITY_DANA_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_MORGAN_PASSWORD: ${IDENTITY_MORGAN_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_RILEY_PASSWORD: ${IDENTITY_RILEY_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_AVERY_PASSWORD: ${IDENTITY_AVERY_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_DESK_CLIENT_SECRET: ${IDENTITY_DESK_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_INTAKE_HANDWRITTEN_CLIENT_SECRET: ${IDENTITY_INTAKE_HANDWRITTEN_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_EXPERT_CLIENT_SECRET: ${IDENTITY_EXPERT_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_ORCHESTRATOR_CLIENT_SECRET: ${IDENTITY_ORCHESTRATOR_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_EVALUATION_CLIENT_SECRET: ${IDENTITY_EVALUATION_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_KNOWLEDGE_GATE_CLIENT_SECRET: ${IDENTITY_KNOWLEDGE_GATE_CLIENT_SECRET:?run platform/identity/setup.sh}
      # Set by stack-gate.sh for the merge step only: what it found in the client's output.
      REVOCATION_FAILURES: ${REVOCATION_FAILURES:-}
    command: ["node", "/repo/platform/identity/gate/stack-gate.ts"]

networks:
  # The default network of the compose project the identity service runs in: <project>_default.
  stack:
    external: true
    name: ${IDENTITY_GATE_NETWORK:?pass the compose project name to platform/identity/gate.sh}
