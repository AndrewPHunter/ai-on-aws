# The lab's OpenID Connect provider: Keycloak in development mode, with the realm "lab" imported from
# realm/lab-realm.json at every start. A local stand-in for the identity provider behind AgentCore's JWT
# authorizer. Its secrets come from platform/identity/.env, written by platform/identity/setup.sh; without
# that file nothing starts.
#
#   docker compose -f platform/identity/compose.yaml up -d --wait
name: ai-on-aws-identity

services:
  identity:
    # quay.io/keycloak/keycloak:26.8.2, pinned by the digest of its multi-architecture index
    # (linux/amd64, linux/arm64)
    image: quay.io/keycloak/keycloak@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IDENTITY_ADMIN_USERNAME:?run platform/identity/setup.sh}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?run platform/identity/setup.sh}
      # The browser's address for the provider. It is the issuer of every token and the origin of every
      # front-channel URL (sign-in page, sign-out), whichever address a request came in on.
      KC_HOSTNAME: http://localhost:8090
      # Back-channel URLs (token, keys, userinfo) follow the address the request came in on, so a container
      # on the stack's network is given http://identity:8080/... and can reach them.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_DB: dev-file
      KC_LOG_LEVEL: info
      # Read by the realm import, which replaces each placeholder in realm/lab-realm.json with the value here.
      IDENTITY_DESK_CLIENT_SECRET: ${IDENTITY_DESK_CLIENT_SECRET:?run platform/identity/setup.sh}
      IDENTITY_RILEY_PASSWORD: ${IDENTITY_RILEY_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_DANA_PASSWORD: ${IDENTITY_DANA_PASSWORD:?run platform/identity/setup.sh}
    ports:
      # Published on this machine only.
      - "127.0.0.1:8090:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    # No read_only: start-dev rebuilds Keycloak's server under /opt/keycloak/lib/quarkus at every start, and
    # that directory must start with the image's own files, so neither a read-only root nor a tmpfs over it
    # works (see platform/identity/README.md, "Hardening").
    tmpfs:
      - /tmp:uid=1000,gid=0,mode=0770
      # The dev-file database: nothing survives a stop, and every start imports the realm afresh.
      - /opt/keycloak/data:uid=1000,gid=0,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      # Healthy only once the realm answers: its discovery document must return 200. The image has no curl,
      # so bash sends the request.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/lab/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 3
