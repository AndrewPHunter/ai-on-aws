# Runs the evaluation runner, and the attack runner, on the network of a running stack, as one of the stack's
# containers would. Run them with evaluation/run.sh and evaluation/attacks.sh, which build the image, name the network
# and pass platform/identity/.env.
name: ai-on-aws-evaluation

services:
  runner:
    # The evaluation piece's image, built by evaluation/run.sh from the run stage of toolchain/Dockerfile.
    image: ${EVALUATION_IMAGE:?run evaluation/run.sh}
    environment:
      # The runner gets its token as its own client, evaluation, by client credentials. Only this value is taken
      # from platform/identity/.env.
      IDENTITY_EVALUATION_CLIENT_SECRET: ${IDENTITY_EVALUATION_CLIENT_SECRET:?run platform/identity/setup.sh}
    working_dir: /repo
    volumes:
      # The sample it reads, and the run folder it writes.
      - ./data:/repo/evaluation/data
      - ./sample.json:/repo/evaluation/sample.json:ro
      # The code the command line imports beside its own (the manifest's schema and the shared reference rule, the
      # expert's number rule).
      - ../knowledge/src:/repo/knowledge/src:ro
      - ../agents/src:/repo/agents/src:ro
    networks:
      - stack
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  attacks:
    # The same image, run by evaluation/attacks.sh: it plays the attack, control and fault cases through the client.
    image: ${EVALUATION_IMAGE:?run evaluation/attacks.sh}
    environment:
      # The attack runner signs each of the four people in through the client. Only these values are taken from
      # platform/identity/.env.
      IDENTITY_DANA_PASSWORD: ${IDENTITY_DANA_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_MORGAN_PASSWORD: ${IDENTITY_MORGAN_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_RILEY_PASSWORD: ${IDENTITY_RILEY_PASSWORD:?run platform/identity/setup.sh}
      IDENTITY_AVERY_PASSWORD: ${IDENTITY_AVERY_PASSWORD:?run platform/identity/setup.sh}
    working_dir: /repo
    volumes:
      # The run folder it writes, and the committed cases it reads.
      - ./data:/repo/evaluation/data
      - ./attacks:/repo/evaluation/attacks:ro
      # How a program acts as a person through the client (desk.ts), and what it imports; and the code the command
      # line imports beside its own, as for the runner.
      - ../platform/identity/src:/repo/platform/identity/src:ro
      - ../knowledge/src:/repo/knowledge/src:ro
      - ../agents/src:/repo/agents/src:ro
    networks:
      - stack
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

networks:
  # The default network of the compose project the stack runs in: <project>_default.
  stack:
    external: true
    name: ${EVALUATION_NETWORK:?pass the compose project name to evaluation/run.sh}
