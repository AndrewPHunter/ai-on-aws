# Runs the evaluation runner on the network of a running stack, as one of the stack's containers would. Run it with
# evaluation/run.sh, which builds the image, names the network and passes platform/identity/.env.
name: ai-on-aws-evaluation

services:
  runner:
    # The evaluation piece's image, built by evaluation/run.sh from the run stage of toolchain/Dockerfile.
    image: ${EVALUATION_IMAGE:?run evaluation/run.sh}
    environment:
      # The runner gets its token as its own client, evaluation, by client credentials. Only this value is taken
      # from platform/identity/.env.
      IDENTITY_EVALUATION_CLIENT_SECRET: ${IDENTITY_EVALUATION_CLIENT_SECRET:?run platform/identity/setup.sh}
    working_dir: /repo
    volumes:
      # The sample it reads, and the run folder it writes.
      - ./data:/repo/evaluation/data
      - ./sample.json:/repo/evaluation/sample.json:ro
      # The code the command line imports beside its own (the manifest's schema and the shared reference rule, the
      # expert's number rule).
      - ../knowledge/src:/repo/knowledge/src:ro
      - ../agents/src:/repo/agents/src:ro
    networks:
      - stack
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

networks:
  # The default network of the compose project the stack runs in: <project>_default.
  stack:
    external: true
    name: ${EVALUATION_NETWORK:?pass the compose project name to evaluation/run.sh}
