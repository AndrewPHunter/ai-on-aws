name: ai-on-aws-case-system

services:
  case-system:
    build:
      context: ../..
      dockerfile: toolchain/Dockerfile
      target: run
      args:
        PIECE: tools/case-system
    image: ai-on-aws-case-system:local
    command: ["node", "tools/case-system/src/main.ts"]
    environment:
      CASE_DB_PATH: /data/cases.sqlite
      # The access token every request but /ping must carry. Each intake agent exchanges the token it
      # received for one issued to its own client; the client sends the reviewer's own on review calls.
      # The scopes each server needs are set in code. The discovery document is fetched by the identity
      # service's name on the shared network; the issuer is the browser's address for it.
      AUTH_DISCOVERY_URL: http://identity:8080/realms/lab/.well-known/openid-configuration
      AUTH_ISSUER: http://localhost:8090/realms/lab
      AUTH_ALLOWED_AUDIENCE: case-system
      AUTH_AGENT_SERVER_CLIENTS: intake-handwritten,intake-strands
      AUTH_REVIEW_SERVER_CLIENTS: desk
      AUTH_ROLES_CLAIM: roles
      # Spans go to the lab's trace store by its service name on the shared network. When it is not running
      # the exports fail and are counted; every answer is the same.
      TELEMETRY_ENDPOINT: http://telemetry:4318/v1/traces
    ports:
      # Published on this machine only. 8000 is for agents (MCP), 8001 is for reviewers.
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - cases:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/ping').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  # The SQLite file lives here, so cases survive the container being removed.
  cases:
