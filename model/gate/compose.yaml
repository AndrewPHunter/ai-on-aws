# Runs the gate test from any machine that can reach the model server.
# It needs no GPU, so it normally runs on the machine the agents will run on:
# that way it also proves the network path the agents will use.
name: ai-on-aws-model-gate

services:
  gate:
    # node:22-bookworm-slim (Node 22.23.5), pinned by digest
    image: node@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
    volumes:
      - ./:/gate:ro
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL}
      MODEL_ID: ${MODEL_ID:?set MODEL_ID}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY}
    command: ["node", "/gate/gate.ts", "/gate/gate.config.json"]
