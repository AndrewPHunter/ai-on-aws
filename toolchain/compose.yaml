# The check container: typecheck, lint and tests for every TypeScript file. Run it with toolchain/check.sh.
name: ai-on-aws-toolchain

services:
  check:
    build:
      context: ..
      dockerfile: toolchain/Dockerfile
      target: check
    # Named for the checkout it was built from, so two checkouts never share an image. check.sh sets the tag.
    image: ai-on-aws-toolchain-check:${CHECK_IMAGE_TAG:?run toolchain/check.sh, which names the image for this checkout}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # npm writes its logs under its cache directory; the root filesystem is read-only.
      npm_config_cache: /tmp/npm-cache
      npm_config_update_notifier: "false"
