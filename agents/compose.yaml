name: ai-on-aws-agents

# What the four agents run with: the two implementations of the intake agent, the label expert and the
# orchestrator. They differ only in the file that starts them, the name they record under, the services they
# call, the server that serves their contract, and the port published on this machine.
x-agent: &agent
  build:
    context: ..
    dockerfile: toolchain/Dockerfile
    target: run
    args:
      PIECE: agents
  image: ai-on-aws-agents:local
  # Where the model server is and the key it expects, as written by model/setup.sh.
  # The agent reads MODEL_BASE_URL and MODEL_API_KEY from it. Without this file nothing starts:
  # set up the model server first.
  env_file:
    - ../model/.env
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ping').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 5

# The access token every POST /invocations must carry: the same values AgentCore Runtime's JWT
# authorizer is configured with (discovery URL, allowed audience, allowed client ids). The discovery
# document is fetched by the identity service's name on the shared network; the issuer it and every
# token name is the browser's address for it. Each agent sets its own audience (its AGENT_ID), clients
# and scope below.
#
# Before it connects to its tool server, each agent exchanges the token it was called with, as itself
# (client id AGENT_ID, with its own secret), for one meant for that server, at the token endpoint here. The
# orchestrator does the same for each call to another agent.
# The secrets come from platform/identity/.env, which the root compose.yaml reads for this file.
x-auth: &auth
  AUTH_DISCOVERY_URL: http://identity:8080/realms/lab/.well-known/openid-configuration
  AUTH_ISSUER: http://localhost:8090/realms/lab
  AUTH_ROLES_CLAIM: roles
  EXCHANGE_TOKEN_ENDPOINT: http://identity:8080/realms/lab/protocol/openid-connect/token

services:
  # The intake agent with its loop written by hand, served by the hand-written contract server.
  intake-handwritten:
    <<: *agent
    command: ["node", "agents/src/intake/main-handwritten.ts"]
    environment:
      <<: *auth
      AGENT_ID: intake-handwritten
      AUTH_ALLOWED_AUDIENCE: intake-handwritten
      AUTH_ALLOWED_CLIENTS: desk,lab-explorer
      AUTH_REQUIRED_SCOPES: agents:intake
      EXCHANGE_CLIENT_SECRET: ${IDENTITY_INTAKE_HANDWRITTEN_CLIENT_SECRET:?run platform/identity/setup.sh}
      # The case system's MCP endpoint, by its service name on the shared network.
      CASE_MCP_URL: http://case-system:8000/mcp
    ports:
      # Published on this machine only, for calling the agent directly.
      - "127.0.0.1:8080:8080"

  # The same agent on Strands: same prompt, rules, limits and contract; Strands owns the loop, and AWS's SDK
  # server serves the contract.
  intake-strands:
    <<: *agent
    command: ["node", "agents/src/intake/main-strands.ts"]
    environment:
      <<: *auth
      AGENT_ID: intake-strands
      AUTH_ALLOWED_AUDIENCE: intake-strands
      # The orchestrator calls it as its own client, to screen every message it receives.
      AUTH_ALLOWED_CLIENTS: desk,orchestrator,lab-explorer
      AUTH_REQUIRED_SCOPES: agents:intake
      EXCHANGE_CLIENT_SECRET: ${IDENTITY_INTAKE_STRANDS_CLIENT_SECRET:?run platform/identity/setup.sh}
      CASE_MCP_URL: http://case-system:8000/mcp
      # Served by AWS's SDK server (BedrockAgentCoreApp). on: a local stand-in for AgentCore Runtime's front
      # door listens on 8080 in the same process, checks the token, gives the request a session id and
      # forwards only the headers Runtime would. On AgentCore Runtime this is off and Runtime does those things.
      LOCAL_RUNTIME_EDGE: "on"
    ports:
      - "127.0.0.1:8081:8080"

  # The label expert, on Strands: answers a question about a medicine from its approved label. It calls the
  # retrieval service and nothing that writes.
  expert:
    <<: *agent
    command: ["node", "agents/src/expert/main.ts"]
    environment:
      <<: *auth
      AGENT_ID: expert
      AUTH_ALLOWED_AUDIENCE: expert
      # The evaluation harness and the orchestrator call the label expert as their own clients. The orchestrator
      # asks for agents:expert:delegated, which only its client may ask for.
      AUTH_ALLOWED_CLIENTS: desk,evaluation,orchestrator,lab-explorer
      AUTH_REQUIRED_SCOPES: agents:expert,agents:expert:delegated
      EXCHANGE_CLIENT_SECRET: ${IDENTITY_EXPERT_CLIENT_SECRET:?run platform/identity/setup.sh}
      # The retrieval service's MCP endpoint, by its service name on the shared network.
      KNOWLEDGE_MCP_URL: http://knowledge:8000/mcp
      # Served by AWS's SDK server, behind the local stand-in for AgentCore Runtime's front door, as above.
      LOCAL_RUNTIME_EDGE: "on"
    ports:
      - "127.0.0.1:8082:8080"

  # The orchestrator, on Strands: has every message screened by the intake agent on Strands, and the label
  # questions in it answered by the label expert, each called over the agent contract with a token exchanged
  # for that agent. It writes its reply in code.
  orchestrator:
    <<: *agent
    command: ["node", "agents/src/orchestrator/main.ts"]
    environment:
      <<: *auth
      AGENT_ID: orchestrator
      AUTH_ALLOWED_AUDIENCE: orchestrator
      AUTH_ALLOWED_CLIENTS: desk,contact-form,lab-explorer
      AUTH_REQUIRED_SCOPES: agents:orchestrator
      EXCHANGE_CLIENT_SECRET: ${IDENTITY_ORCHESTRATOR_CLIENT_SECRET:?run platform/identity/setup.sh}
      # The two agents it calls, by their service names on the shared network.
      INTAKE_AGENT_URL: http://intake-strands:8080
      EXPERT_AGENT_URL: http://expert:8080
      # Served by AWS's SDK server, behind the local stand-in for AgentCore Runtime's front door, as above.
      LOCAL_RUNTIME_EDGE: "on"
    ports:
      - "127.0.0.1:8083:8080"
