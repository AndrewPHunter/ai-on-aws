# The lab, started together on one network: the agents, the case system they write to, the client, the identity
# provider, the search engine with the retrieval service, and the trace store.
#
#   docker compose up -d --build --wait
#
# The model server is not started here. It runs on the GPU machine, set up by model/setup.sh, and
# that setup writes model/.env, which tells the agents where it is. Set it up first.
name: ai-on-aws

include:
  - tools/case-system/compose.yaml
  # The agents' compose file is read with platform/identity/.env, for each agent's client secret.
  - path: agents/compose.yaml
    env_file: platform/identity/.env
  # The client's compose file is read with platform/identity/.env, for the secrets of its three clients, and with
  # model/.env, for the three model servers' base URLs its status checks.
  - path: client/compose.yaml
    env_file:
      - platform/identity/.env
      - model/.env
  - platform/identity/compose.yaml
  # The trace store, where pieces export execution evidence. Published on this machine only.
  - platform/telemetry/compose.yaml
  # The search engine and the retrieval service. The index is built into the running stack with knowledge/index.sh.
  - knowledge/compose.yaml
