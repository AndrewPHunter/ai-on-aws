# Runs the knowledge gate on the network of a running stack, as one of the stack's containers would. Run it with
# knowledge/gate.sh, which builds the image, names the network and passes platform/identity/.env.
name: ai-on-aws-knowledge-gate

services:
  gate:
    # The knowledge piece's image, built by knowledge/gate.sh from the run stage of toolchain/Dockerfile.
    image: ${KNOWLEDGE_IMAGE:?run knowledge/gate.sh}
    # The embedding model's identity (committed; no secret), compared with what the index records when the service
    # answers with a strategy that uses vectors.
    env_file:
      - ../../model/retrieval.env
    environment:
      # The gate gets its token as its own client, knowledge-gate, by client credentials.
      IDENTITY_KNOWLEDGE_GATE_CLIENT_SECRET: ${IDENTITY_KNOWLEDGE_GATE_CLIENT_SECRET:?run platform/identity/setup.sh}
    command: ["node", "knowledge/src/gate/gate.ts"]
    working_dir: /repo
    volumes:
      # The data it compares with what the service answers (the manifest, the chunk report and chunks, the
      # benchmark's questions).
      - ../data:/data:ro
      - ../corpus:/corpus:ro
    networks:
      - stack
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

networks:
  # The default network of the compose project the stack runs in: <project>_default.
  stack:
    external: true
    name: ${KNOWLEDGE_GATE_NETWORK:?pass the compose project name to knowledge/gate.sh}
